<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VECTOR CRUSH</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:"Courier New",monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
  #c{display:block;width:100%;height:100%}
</style>
<canvas id="c"></canvas>
<script>
"use strict";
(function(){
// ---- config ----
var COLS=7, ROWS=9, NCOL=5, GAME_TIME=60;
var COL=[ "#00e5ff", "#ff2fb0", "#ffe500", "#39ff88", "#ff8a2a" ]; // 5 vector colours
var BEST_KEY="vcrush_best";

// ---- canvas ----
var cv=document.getElementById("c"), ctx=cv.getContext("2d");
var W=0,H=0,DPR=1, cell=0, bx=0, by=0, topH=0, muteX=0, muteY=0, muteR=20;
function resize(){
  W=window.innerWidth; H=window.innerHeight;
  // DPR=1 is fine for wireframe; cap the backing buffer so full-canvas fills stay cheap
  DPR=Math.min(window.devicePixelRatio||1, 2, 1600/Math.max(W,H));
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+"px"; cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  topH=Math.max(84,Math.min(H*0.16,160));
  var m=Math.max(8,W*0.02);
  cell=Math.max(6, Math.min((W-m*2)/COLS,(H-topH-m*2)/ROWS)); // guard tiny/short viewports (never negative)
  var boardW=cell*COLS, boardH=cell*ROWS;
  bx=(W-boardW)/2; by=topH+(H-topH-boardH)/2;
  muteR=Math.min(26,Math.max(15,W*0.06)); muteX=muteR+12; muteY=H-muteR-12;
}
window.addEventListener("resize",resize); resize();

// ---- audio (synth, no files) ----
var AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
function tone(f,dur,type,vol,f2){
  var a=ac(); if(!a)return;
  var o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
  o.type=type||"square"; o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur,vol,lp){
  var a=ac(); if(!a)return;
  var n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  var s=a.createBufferSource(); s.buffer=b;
  var f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=lp||1200;
  var g=a.createGain(); g.gain.value=vol||0.3;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function sfxClear(n){ tone(220+Math.min(n,12)*40, .12, "square", .18, 520+n*40); }
function sfxCreate(){ tone(300,.18,"sawtooth",.2,900); tone(600,.18,"square",.12,1400); }
function sfxRocket(){ noise(.35,.35,3000); tone(900,.35,"sawtooth",.15,120); }
function sfxBomb(){ noise(.5,.6,700); tone(90,.5,"sawtooth",.35,40); }
function sfxBall(){ for(var i=0;i<6;i++)(function(k){setTimeout(function(){tone(400+k*160,.14,"triangle",.16);},k*45);})(i); }
function sfxPlane(){ tone(700,.18,"triangle",.18,1500); }
function sfxTick(){ tone(1400,.06,"square",.15); }
function sfxCombo(n){ tone(500,.2,"square",.2,1200); tone(760,.25,"triangle",.14,1600); }
function sfxOver(){ [660,520,390,260].forEach(function(f,i){setTimeout(function(){tone(f,.3,"sawtooth",.25);},i*160);}); }

// ---- chiptune BGM: short looping I-V-vi-IV, drums+bass+lead (all synth) ----
var muted=(localStorage.getItem("vcrush_mute")==="1");
var musGain=null, musTimer=null, musStep=0, musNext=0;
var TEMPO=142, STEP16=15/TEMPO, MSTEPS=64;          // 4 bars x 16 sixteenths
var CH=[[0,4,7],[7,11,14],[9,12,16],[5,9,12]], ROOT=[0,7,9,5], MB=48; // C G Am F
var LEAD=[0,1,2,1,0,2,1,2];
function midi(n){ return 440*Math.pow(2,(n-69)/12); }
function mgain(){ var a=ac(); if(!a)return null; if(!musGain){ musGain=a.createGain(); musGain.gain.value=muted?0:0.30; musGain.connect(a.destination); } return musGain; }
function mNote(f,t,dur,type,vol){ var a=ac(),d=mgain(); if(!a||!d)return; var o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(d); o.start(t); o.stop(t+dur+0.02); }
function mKick(t){ var a=ac(),d=mgain(); if(!a||!d)return; var o=a.createOscillator(),g=a.createGain(); o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15); o.connect(g); g.connect(d); o.start(t); o.stop(t+0.17); }
function mNoise(t,dur,vol,type,freq){ var a=ac(),d=mgain(); if(!a||!d)return; var n=Math.max(1,(a.sampleRate*dur)|0),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0); for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1); var s=a.createBufferSource(); s.buffer=b; var f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq; var g=a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); s.connect(f); f.connect(g); g.connect(d); s.start(t); s.stop(t+dur+0.02); }
function mStepFn(step,t){
  var bar=((step>>4)&3), s=step&15, chord=CH[bar], root=MB+ROOT[bar];
  if(s===0||s===8||s===11) mKick(t);
  if(s===4||s===12) mNoise(t,0.12,0.22,"bandpass",1800);            // snare
  if(s%2===0) mNoise(t, s%4===2?0.07:0.03, 0.10, "highpass",8000);  // hat
  if(s%2===0) mNote(midi(root-12), t, STEP16*1.7, "triangle", 0.26);// bass
  if(s%2===0){ var idx=(s>>1)&7, deg=chord[LEAD[idx]]+12+(idx===7?12:0); mNote(midi(MB+deg), t, STEP16*1.4, "square", 0.15); } // lead
}
function musicTick(){ var a=ac(); if(!a)return; while(musNext<a.currentTime+0.12){ mStepFn(musStep,musNext); musStep=(musStep+1)%MSTEPS; musNext+=STEP16; } }
function musicStart(){ var a=ac(); if(!a||musTimer||muted)return; if(musGain)musGain.gain.value=0.30; musStep=0; musNext=a.currentTime+0.06; musicTick(); musTimer=setInterval(musicTick,25); }
function musicStop(){ if(musTimer){ clearInterval(musTimer); musTimer=null; } }
function toggleMute(){ muted=!muted; localStorage.setItem("vcrush_mute",muted?"1":"0"); if(muted){ musicStop(); if(musGain)musGain.gain.value=0; } else { if(musGain)musGain.gain.value=0.30; if(state==="play")musicStart(); } }

// ---- state ----
var grid=[];            // grid[r][c] = cell obj or null
var state="ready";      // ready | play | over
var score=0, best=+(localStorage.getItem(BEST_KEY)||0);
var timeLeft=GAME_TIME, last=0, tickSec=-1, overAt=0;
var shake=0, excite=0, react=0, reactFace="happy", blink=0, blinkT=1.4, T=0;
var parts=[], floats=[];

function newCell(color){ return {color:color, power:0, dy:0, vy:0, sp:0}; }
function randColor(){ return (Math.random()*NCOL)|0; }

function initBoard(){
  grid=[];
  for(var r=0;r<ROWS;r++){ grid[r]=[]; for(var c=0;c<COLS;c++){ var o=newCell(randColor()); o.dy=-(ROWS+r)*cell; grid[r][c]=o; } }
}
function startGame(){
  ac(); score=0; timeLeft=GAME_TIME; tickSec=-1; state="play";
  shake=0; excite=0; parts=[]; floats=[]; initBoard(); last=performance.now(); musicStart();
}

// ---- helpers ----
function inb(r,c){ return r>=0&&r<ROWS&&c>=0&&c<COLS; }
var POW={rV:1,rH:2,bomb:3,ball:4,plane:5};

// connected same-colour group (4-dir flood)
function group(r0,c0){
  var col=grid[r0][c0].color, seen={}, st=[[r0,c0]], out=[];
  seen[r0+","+c0]=1;
  while(st.length){
    var p=st.pop(); out.push(p);
    var nb=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var i=0;i<4;i++){ var r=p[0]+nb[i][0], c=p[1]+nb[i][1], k=r+","+c;
      if(inb(r,c)&&!seen[k]&&grid[r][c]&&!grid[r][c].power&&grid[r][c].color===col){ seen[k]=1; st.push([r,c]); }
    }
  }
  return out;
}

// analyse group shape -> which power (or 0). Higher-tier shapes win.
function analyse(cells){
  var set={}; for(var i=0;i<cells.length;i++) set[cells[i][0]+","+cells[i][1]]=1;
  var has=function(r,c){ return set[r+","+c]===1; };
  var maxH=1,maxV=1, tl=false, box=false;
  for(i=0;i<cells.length;i++){
    var r=cells[i][0], c=cells[i][1];
    var h=1; while(has(r,c+h))h++; if(h>maxH)maxH=h;
    var v=1; while(has(r+v,c))v++; if(v>maxV)maxV=v;
    // T / L : a cell with a run>=3 horizontally AND >=3 vertically through it
    var hl=1; while(has(r,c-hl))hl++; var hr=1; while(has(r,c+hr))hr++;
    var vu=1; while(has(r-vu,c))vu++; var vd=1; while(has(r+vd,c))vd++;
    if((hl+hr-1)>=3 && (vu+vd-1)>=3) tl=true;
    if(has(r,c+1)&&has(r+1,c)&&has(r+1,c+1)) box=true; // 2x2 box
  }
  if(maxH>=5||maxV>=5) return POW.ball;        // 5 in a row -> mirror ball
  if(tl && cells.length>=5) return POW.bomb;   // T/L of 5+ -> bomb
  if(box && cells.length>=4) return POW.plane; // box of 4+ -> paper plane
  if(maxH>=4) return POW.rV;                   // horizontal 4 -> vertical rocket
  if(maxV>=4) return POW.rH;                   // vertical 4 -> horizontal rocket
  return 0;
}

// ---- clearing / effects ----
function worldX(c){ return bx+c*cell+cell/2; }
function worldY(r){ return by+r*cell+cell/2; }

function spark(r,c,color){
  var x=worldX(c), y=worldY(r);
  for(var i=0;i<4;i++){ var a=Math.random()*6.28, sp=cell*(1+Math.random()*3);
    if(parts.length<400) parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,max:.4+Math.random()*.4,color:color,len:cell*0.3});
  }
}
function floatText(x,y,t,color){ floats.push({x:x,y:y,txt:t,life:1,color:color||"#fff"}); }
function beam(x1,y1,x2,y2,color){ floats.push({beam:1,x1:x1,y1:y1,x2:x2,y2:y2,life:1,color:color}); }
function ring(x,y,r,color){ floats.push({ring:1,x:x,y:y,r:r,life:1,color:color}); }
function trail(x1,y1,x2,y2,color){ floats.push({beam:1,x1:x1,y1:y1,x2:x2,y2:y2,life:1,color:color||COL[3]}); }

// clear a list of cells; power cells found are chained. returns count of normal cells cleared
function clearCells(list,lvl){
  var q=[], cnt=0;
  for(var i=0;i<list.length;i++){
    var r=list[i][0], c=list[i][1]; if(!inb(r,c))continue;
    var g=grid[r][c]; if(!g)continue;
    if(g.power){ q.push({r:r,c:c,p:g.power}); }
    else { spark(r,c,COL[g.color]); score+=Math.round(10*(1+lvl*0.5)); cnt++; }
    grid[r][c]=null;
  }
  for(i=0;i<q.length;i++) cnt+=activate(q[i].r,q[i].c,q[i].p,lvl+1);
  return cnt;
}

// activate a single power block; returns cells cleared
function activate(r,c,p,lvl){
  var list=[], i,j;
  if(p===POW.rV){ sfxRocket(); shake+=8; for(i=0;i<ROWS;i++)list.push([i,c]); beam(worldX(c),0,worldX(c),H,COL[2]); }
  else if(p===POW.rH){ sfxRocket(); shake+=8; for(j=0;j<COLS;j++)list.push([r,j]); beam(0,worldY(r),W,worldY(r),COL[2]); }
  else if(p===POW.bomb){ sfxBomb(); shake+=16; for(i=-1;i<=1;i++)for(j=-1;j<=1;j++)list.push([r+i,c+j]); ring(worldX(c),worldY(r),cell*2.2,"#fff"); }
  else if(p===POW.plane){ sfxPlane(); shake+=4; var t=randTarget(); if(t){ trail(worldX(c),worldY(r),worldX(t[1]),worldY(t[0])); list.push(t);} }
  else if(p===POW.ball){ sfxBall(); shake+=10; var col=topColor(); for(i=0;i<ROWS;i++)for(j=0;j<COLS;j++){var g=grid[i][j]; if(g&&!g.power&&g.color===col)list.push([i,j]);} ring(worldX(c),worldY(r),cell*3,COL[0]); }
  return clearCells(list,lvl||1);
}

function randTarget(){
  var opts=[];
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++) if(grid[r][c])opts.push([r,c]);
  return opts.length?opts[(Math.random()*opts.length)|0]:null;
}
function topColor(){
  var cnt=[0,0,0,0,0];
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){var g=grid[r][c]; if(g&&!g.power)cnt[g.color]++;}
  var m=0,mi=0; for(var i=0;i<NCOL;i++)if(cnt[i]>m){m=cnt[i];mi=i;} return mi;
}

// ---- power-block combos (adjacent power tapped). Higher rank wins. ----
function comboRank(a,b){
  var isR=function(p){return p===POW.rV||p===POW.rH;};
  if(a===POW.ball&&b===POW.ball)return 100;
  if(a===POW.ball||b===POW.ball){ var o=a===POW.ball?b:a; return o===POW.bomb?95:90; }
  if(a===POW.bomb&&b===POW.bomb)return 80;
  if((isR(a)&&b===POW.bomb)||(isR(b)&&a===POW.bomb))return 70;
  if(isR(a)&&isR(b))return 60;
  if((a===POW.plane&&b===POW.bomb)||(b===POW.plane&&a===POW.bomb))return 40;
  if((a===POW.plane&&isR(b))||(b===POW.plane&&isR(a)))return 35;
  if(a===POW.plane&&b===POW.plane)return 30;
  return 10;
}
function runCombo(r,c,pa, nr,nc,pb){
  var list=[], i,j, cnt=0;
  grid[r][c]=null; grid[nr][nc]=null; // consume both
  var isR=function(p){return p===POW.rV||p===POW.rH;};
  shake+=14;
  if(pa===POW.ball&&pb===POW.ball){ sfxBomb(); sfxBall(); shake+=30; for(i=0;i<ROWS;i++)for(j=0;j<COLS;j++)list.push([i,j]); ring(worldX(c),worldY(r),cell*7,COL[1]); }
  else if(pa===POW.ball||pb===POW.ball){
    var other=pa===POW.ball?pb:pa, col=topColor(); sfxBall(); shake+=20;
    var acts=[];
    for(i=0;i<ROWS;i++)for(j=0;j<COLS;j++){ var g=grid[i][j]; if(g&&!g.power&&g.color===col){ g.power=(other===POW.bomb)?POW.bomb:(Math.random()<.5?POW.rV:POW.rH); acts.push([i,j,g.power]); } }
    for(i=0;i<acts.length;i++){ var a=acts[i]; if(grid[a[0]][a[1]]){ grid[a[0]][a[1]]=null; cnt+=activate(a[0],a[1],a[2],2); } }
  }
  else if(pa===POW.bomb&&pb===POW.bomb){ sfxBomb(); shake+=14; for(i=-2;i<=2;i++)for(j=-2;j<=2;j++)list.push([r+i,c+j]); ring(worldX(c),worldY(r),cell*4,"#fff"); }
  else if((isR(pa)&&pb===POW.bomb)||(isR(pb)&&pa===POW.bomb)){ sfxBomb(); sfxRocket(); for(i=-1;i<=1;i++)for(j=0;j<COLS;j++)list.push([r+i,j]); for(i=0;i<ROWS;i++)for(j=-1;j<=1;j++)list.push([i,c+j]); }
  else if(isR(pa)&&isR(pb)){ sfxRocket(); for(j=0;j<COLS;j++)list.push([r,j]); for(i=0;i<ROWS;i++)list.push([i,c]); beam(0,worldY(r),W,worldY(r),COL[2]); beam(worldX(c),0,worldX(c),H,COL[2]); }
  else if((pa===POW.plane&&pb===POW.bomb)||(pb===POW.plane&&pa===POW.bomb)){ sfxPlane(); sfxBomb(); var t=randTarget(); if(t){ trail(worldX(c),worldY(r),worldX(t[1]),worldY(t[0])); for(i=-1;i<=1;i++)for(j=-1;j<=1;j++)list.push([t[0]+i,t[1]+j]); } }
  else if((pa===POW.plane&&isR(pb))||(pb===POW.plane&&isR(pa))){ sfxPlane(); sfxRocket(); var rk=isR(pa)?pa:pb; var t2=randTarget(); if(t2){ trail(worldX(c),worldY(r),worldX(t2[1]),worldY(t2[0])); if(rk===POW.rV){for(i=0;i<ROWS;i++)list.push([i,t2[1]]);}else{for(j=0;j<COLS;j++)list.push([t2[0],j]);} } }
  else if(pa===POW.plane&&pb===POW.plane){ sfxPlane(); for(var k=0;k<3;k++){var t3=randTarget(); if(t3){trail(worldX(c),worldY(r),worldX(t3[1]),worldY(t3[0])); list.push(t3);} } }
  cnt+=clearCells(list,1);
  return cnt;
}

// ---- tap resolution ----
function resolveTap(r,c){
  if(!inb(r,c)||!grid[r][c]) return;
  var g=grid[r][c];
  if(g.power){
    // adjacent power? pick the highest-rank combo
    var nb=[[1,0],[-1,0],[0,1],[0,-1]], best=-1, bp=null;
    for(var i=0;i<4;i++){ var nr=r+nb[i][0], nc=c+nb[i][1];
      if(inb(nr,nc)&&grid[nr][nc]&&grid[nr][nc].power){ var rk=comboRank(g.power,grid[nr][nc].power); if(rk>best){best=rk; bp=[nr,nc];} } }
    var total;
    if(bp){ total=runCombo(r,c,g.power, bp[0],bp[1],grid[bp[0]][bp[1]].power); sfxCreate(); }
    else { grid[r][c]=null; total=activate(r,c,g.power,1); }
    finishTap(total, worldX(c), worldY(r));
    return;
  }
  var cells=group(r,c);
  if(cells.length<2){ tone(140,.08,"square",.12); return; }
  var pw=analyse(cells);
  var cleared=0;
  if(pw){
    // keep the tapped cell as the new power block, clear the rest
    var col=g.color;
    for(var j=0;j<cells.length;j++){ var rr=cells[j][0], cc=cells[j][1];
      if(rr===r&&cc===c) continue;
      spark(rr,cc,COL[col]); grid[rr][cc]=null; score+=10; cleared++;
    }
    grid[r][c]={color:col,power:pw,dy:0,vy:0,sp:1};
    sfxCreate(); floatText(worldX(c),worldY(r),"POWER!",COL[col]); shake+=Math.min(cells.length,10);
  } else {
    for(var k=0;k<cells.length;k++){ var a=cells[k]; spark(a[0],a[1],COL[g.color]); grid[a[0]][a[1]]=null; score+=10; cleared++; }
    sfxClear(cells.length); shake+=Math.min(cells.length*0.8,12);
  }
  finishTap(cleared, worldX(c), worldY(r));
}

function finishTap(n, x, y){
  if(n>=5){ var bonus=n*n*3; score+=bonus; floatText(x,y-cell*0.4,"+"+bonus,"#fff"); excite=1; sfxCombo(n); }
  else if(n>0){ floatText(x,y-cell*0.4,"+"+(n*10),COL[0]); }
  if(n>0){ react=0.55; reactFace=["happy","wink","joy"][(Math.random()*3)|0]; } // mascot reacts to every match
  shake=Math.min(shake+n*0.6,42);
  collapse();
}

// gravity + refill with fall animation (dy<0 = rendered above target; physics eases it to 0)
function collapse(){
  for(var c=0;c<COLS;c++){
    var stack=[];
    for(var r=ROWS-1;r>=0;r--){ if(grid[r][c]){ stack.push({obj:grid[r][c],row:r}); grid[r][c]=null; } }
    var nr=ROWS-1;
    for(var i=0;i<stack.length;i++){ var e=stack[i]; e.obj.dy+=(e.row-nr)*cell; e.obj.vy=0; grid[nr][c]=e.obj; nr--; }
    // new blocks: one contiguous stack just above the board (constant dy => same visual spacing, drops as a unit)
    for(r=nr;r>=0;r--){ var o=newCell(randColor()); o.dy=-(nr+1)*cell; o.vy=0; grid[r][c]=o; }
  }
}

// ---- input ----
function pointer(e){
  var rect=cv.getBoundingClientRect();
  var px=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
  var py=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
  ac(); // resume audio on any user gesture
  if((px-muteX)*(px-muteX)+(py-muteY)*(py-muteY) < muteR*muteR*2.2){ toggleMute(); return; }
  if(state==="ready"){ startGame(); return; }
  if(state==="over"){ if(performance.now()-overAt>600){ startGame(); } return; }
  var c=Math.floor((px-bx)/cell), r=Math.floor((py-by)/cell);
  if(inb(r,c)) resolveTap(r,c);
}
cv.addEventListener("mousedown",pointer);
cv.addEventListener("touchstart",function(e){ e.preventDefault(); pointer(e); },{passive:false});

// ---- drawing: double-stroke glow (NO shadowBlur — it kills FPS per-segment) ----
var _col="#fff", _w=2;
function glow(color,w){ _col=color; _w=w||2; }
function gs(){ // glow-stroke the CURRENT path: wide faint underlay, then bright thin
  var a=ctx.globalAlpha; ctx.strokeStyle=_col;
  ctx.globalAlpha=a*0.22; ctx.lineWidth=_w+3.5; ctx.stroke();
  ctx.globalAlpha=a;      ctx.lineWidth=_w;     ctx.stroke();
}
function path(pts,close){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(var i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]); if(close)ctx.closePath(); gs(); }

function drawGlyph(type,cx,cy,s){
  ctx.beginPath();
  if(type===0){ ctx.arc(cx,cy,s,0,6.283); }                                   // circle
  else if(type===1){ ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s,cy+s);ctx.lineTo(cx-s,cy+s);ctx.closePath(); } // triangle
  else if(type===2){ ctx.rect(cx-s*0.8,cy-s*0.8,s*1.6,s*1.6); }               // square
  else if(type===3){ ctx.moveTo(cx,cy-s);ctx.lineTo(cx+s,cy);ctx.lineTo(cx,cy+s);ctx.lineTo(cx-s,cy);ctx.closePath(); } // diamond
  else { ctx.moveTo(cx-s,cy-s);ctx.lineTo(cx+s,cy+s);ctx.moveTo(cx+s,cy-s);ctx.lineTo(cx-s,cy+s); }     // X
  gs();
}

function drawCell(r,c){
  var g=grid[r][c]; if(!g)return;
  var x=bx+c*cell, y=by+r*cell+g.dy, s=cell, m=s*0.13;
  if(g.power){ drawPower(g,x+s/2,y+s/2,s); return; }
  glow(COL[g.color],2);
  ctx.beginPath(); ctx.rect(x+m,y+m,s-2*m,s-2*m); gs();
  drawGlyph(g.color,x+s/2,y+s/2,s*0.2);
}

function drawPower(g,cx,cy,s){
  var t=T*4 + g.sp*10;
  if(g.power===POW.rV||g.power===POW.rH){
    glow(COL[2],2.5);
    ctx.save(); ctx.translate(cx,cy); if(g.power===POW.rH)ctx.rotate(1.5708);
    var b=s*0.30, pulse=1+Math.sin(t)*0.06; ctx.scale(pulse,pulse);
    path([0,-b*1.4, b*0.7,-b*0.3, -b*0.7,-b*0.3],true);   // upper head
    path([0,b*1.4, b*0.7,b*0.3, -b*0.7,b*0.3],true);      // lower head
    ctx.beginPath(); ctx.moveTo(0,-b*0.3); ctx.lineTo(0,b*0.3); gs();
    ctx.beginPath(); ctx.moveTo(-b*0.5,0); ctx.lineTo(b*0.5,0); gs();
    ctx.restore();
  } else if(g.power===POW.bomb){
    var pr=s*0.30*(1+Math.sin(t*1.5)*0.12); glow("#ff5a3a",2.5);
    ctx.beginPath();
    for(var i=0;i<12;i++){ var a=i/12*6.283, rr=(i%2?pr*0.55:pr); var px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath(); gs();
    glow("#ffffff",2); ctx.beginPath(); ctx.arc(cx,cy,pr*0.28,0,6.283); gs();
  } else if(g.power===POW.ball){
    var rr2=s*0.32;
    for(var k=0;k<6;k++){ var a1=t*0.5+k*1.047, hue=((T*120+k*60)%360);
      glow("hsl("+hue+",100%,60%)",2.5);
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(a1)*rr2,cy+Math.sin(a1)*rr2); ctx.lineTo(cx-Math.cos(a1)*rr2,cy-Math.sin(a1)*rr2); gs();
    }
    glow("#ffffff",2); ctx.beginPath(); ctx.arc(cx,cy,rr2,0,6.283); gs();
  } else { // paper plane
    glow(COL[3],2.5); ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.sin(t*0.5)*0.2);
    var b2=s*0.34;
    path([0,-b2, b2*0.8,b2, 0,b2*0.5, -b2*0.8,b2],true);
    ctx.beginPath(); ctx.moveTo(0,-b2); ctx.lineTo(0,b2*0.5); gs();
    ctx.restore();
  }
}

function drawBoardFrame(){
  glow("rgba(0,220,220,0.55)",1.5);
  ctx.beginPath(); ctx.rect(bx-4,by-4,cell*COLS+8,cell*ROWS+8); gs();
  var L=18; glow("#00e5ff",2);
  var cs=[[bx-4,by-4,1,1],[bx+cell*COLS+4,by-4,-1,1],[bx-4,by+cell*ROWS+4,1,-1],[bx+cell*COLS+4,by+cell*ROWS+4,-1,-1]];
  for(var i=0;i<4;i++){ var q=cs[i]; ctx.beginPath(); ctx.moveTo(q[0]+L*q[2],q[1]); ctx.lineTo(q[0],q[1]); ctx.lineTo(q[0],q[1]+L*q[3]); gs(); }
}

function txt(s,x,y,size,color,align){
  ctx.font="bold "+size+"px 'Courier New',monospace";
  ctx.textAlign=align||"left"; ctx.textBaseline="middle"; ctx.lineJoin="round";
  var a=ctx.globalAlpha; ctx.strokeStyle=color;
  ctx.globalAlpha=a*0.25; ctx.lineWidth=Math.max(2,size*0.14); ctx.strokeText(s,x,y);
  ctx.globalAlpha=a;      ctx.lineWidth=Math.max(1,size*0.05); ctx.strokeText(s,x,y);
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
}

// mascot (cat, all lines) — expression driven by time left & recent excitement
function drawMascot(cx,cy,rad,mood){
  glow("#ff2fb0",2);
  path([cx-rad*0.7,cy-rad*0.55, cx-rad*0.95,cy-rad*1.15, cx-rad*0.25,cy-rad*0.85]); // ears
  path([cx+rad*0.7,cy-rad*0.55, cx+rad*0.95,cy-rad*1.15, cx+rad*0.25,cy-rad*0.85]);
  ctx.beginPath(); ctx.ellipse(cx,cy,rad,rad*0.9,0,0,6.283); gs();                  // head
  glow("#00e5ff",1.5);                                                             // whiskers
  for(var s=-1;s<=1;s+=2){ for(var i=0;i<2;i++){ var yy=cy+i*rad*0.18-rad*0.02;
    ctx.beginPath(); ctx.moveTo(cx+s*rad*0.35,cy+i*rad*0.12); ctx.lineTo(cx+s*rad*1.05,yy); gs(); } }
  glow("#ffe500",2);                                                               // bow
  path([cx+rad*0.5,cy-rad*0.7, cx+rad*0.95,cy-rad*0.95, cx+rad*0.95,cy-rad*0.45],true);
  path([cx+rad*0.5,cy-rad*0.7, cx+rad*1.05,cy-rad*0.5, cx+rad*1.05,cy-rad*0.9],true);
  glow("#ffffff",2.4);
  var ey=cy-rad*0.05, ex=rad*0.42;
  if(mood==="excited"){
    for(s=-1;s<=1;s+=2)star(cx+s*ex,ey,rad*0.2);
    ctx.beginPath(); ctx.arc(cx,cy+rad*0.35,rad*0.28,0,3.14); gs();
  } else if(mood==="panic"){
    for(s=-1;s<=1;s+=2){ctx.beginPath();ctx.arc(cx+s*ex,ey,rad*0.16,0,6.283);gs();}
    wavy(cx,cy+rad*0.4,rad*0.5);
    glow("#00e5ff",2); path([cx-rad*0.8,cy-rad*0.1, cx-rad*0.95,cy+rad*0.2, cx-rad*0.7,cy+rad*0.2],true); // sweat
  } else if(mood==="worried"){
    for(s=-1;s<=1;s+=2){ctx.beginPath();ctx.arc(cx+s*ex,ey,rad*0.12,0,6.283);gs();}
    ctx.beginPath(); ctx.arc(cx,cy+rad*0.5,rad*0.24,3.34,6.08); gs();
  } else if(mood==="happy"){
    for(s=-1;s<=1;s+=2){ctx.beginPath();ctx.arc(cx+s*ex,ey+rad*0.05,rad*0.16,3.34,6.08);gs();}
    ctx.beginPath(); ctx.arc(cx,cy+rad*0.28,rad*0.24,0.3,2.84); gs();
  } else if(mood==="wink"){
    ctx.beginPath(); ctx.moveTo(cx-ex-rad*0.14,ey); ctx.lineTo(cx-ex+rad*0.14,ey); gs();       // closed eye —
    ctx.beginPath(); ctx.arc(cx+ex,ey,rad*0.14,0,6.283); gs();                                   // open eye O
    ctx.beginPath(); ctx.arc(cx,cy+rad*0.3,rad*0.22,0.35,2.79); gs();                            // smile
  } else if(mood==="joy"){
    for(s=-1;s<=1;s+=2){ctx.beginPath();ctx.arc(cx+s*ex,ey+rad*0.05,rad*0.16,3.34,6.08);gs();}   // ^ ^ eyes
    ctx.beginPath(); ctx.ellipse(cx,cy+rad*0.4,rad*0.17,rad*0.2,0,0,6.283); gs();                // open smile
  } else if(mood==="dead"){
    for(s=-1;s<=1;s+=2){ x_eye(cx+s*ex,ey,rad*0.14); }
    ctx.beginPath(); ctx.arc(cx,cy+rad*0.5,rad*0.2,3.34,6.08); gs();
  } else { // neutral (with blink)
    if(blink<0.08){ for(s=-1;s<=1;s+=2){ctx.beginPath();ctx.moveTo(cx+s*ex-rad*0.14,ey);ctx.lineTo(cx+s*ex+rad*0.14,ey);gs();} }
    else { for(s=-1;s<=1;s+=2){ctx.beginPath();ctx.arc(cx+s*ex,ey,rad*0.14,0,6.283);gs();} }
    ctx.beginPath(); ctx.moveTo(cx-rad*0.15,cy+rad*0.4); ctx.lineTo(cx+rad*0.15,cy+rad*0.4); gs();
  }
  glow("#ffe500",1.5); ctx.beginPath(); ctx.moveTo(cx,cy+rad*0.12); ctx.lineTo(cx-rad*0.06,cy+rad*0.2); ctx.lineTo(cx+rad*0.06,cy+rad*0.2); ctx.closePath(); gs(); // nose
}
function star(x,y,r){ ctx.beginPath(); for(var i=0;i<10;i++){var a=-1.5708+i*0.6283, rr=i%2?r*0.45:r, px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); gs(); }
function wavy(x,y,w){ ctx.beginPath(); for(var i=0;i<=8;i++){var px=x-w/2+w*i/8, py=y+Math.sin(i*1.4)*3; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} gs(); }
function x_eye(x,y,r){ ctx.beginPath(); ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r); gs(); }

function mascotMood(){
  if(state==="over")return "dead";
  if(excite>0)return "excited";
  if(react>0)return reactFace;
  if(timeLeft<=5)return "panic";
  if(timeLeft<=10)return "worried";
  if(timeLeft>=45)return "happy";
  return "neutral";
}

// ---- update / render ----
function update(dt){
  T+=dt;
  if(state==="play"){
    timeLeft-=dt; if(timeLeft<0)timeLeft=0;
    var s=Math.ceil(timeLeft);
    if(s!==tickSec){ tickSec=s; if(s<=10&&s>0)sfxTick(); }
    if(timeLeft<=0) endGame();
  }
  if(excite>0){ excite-=dt*1.2; if(excite<0)excite=0; }
  if(react>0){ react-=dt; if(react<0)react=0; }
  if(shake>0){ shake-=dt*60; if(shake<0)shake=0; }
  blink-=dt; if(blink<0)blink=blinkT+Math.random()*2;
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){ var g=grid[r][c]; if(!g)continue;
    if(g.dy<0){ g.vy+=cell*75*dt; g.dy+=g.vy*dt; if(g.dy>=0){g.dy=0;g.vy=0;} }
    if(g.sp>0){ g.sp-=dt*3; if(g.sp<0)g.sp=0; }
  }
  for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.life-=dt/p.max; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; if(p.life<=0)parts.splice(i,1); }
  for(i=floats.length-1;i>=0;i--){ var f=floats[i]; f.life-=dt*((f.beam||f.ring)?3:1.6); if(!f.beam&&!f.ring)f.y-=dt*40; if(f.life<=0)floats.splice(i,1); }
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H); // opaque fill = clear
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  ctx.lineJoin="round"; ctx.lineCap="round";

  // HUD: TIME (left) · mascot (top-center) · SCORE (right)
  txt("TIME",bx-4,topH*0.30,Math.min(18,topH*0.16),"#00e5ff","left");
  txt(("0"+Math.ceil(timeLeft)).slice(-2),bx-4,topH*0.66,Math.min(46,topH*0.40),timeLeft<=10?"#ff2fb0":"#ffe500","left");
  txt("SCORE",bx+cell*COLS+4,topH*0.30,Math.min(15,topH*0.13),"#39ff88","right");
  txt(""+score,bx+cell*COLS+4,topH*0.64,Math.min(34,topH*0.30),"#39ff88","right");
  drawMascot(W*0.5, topH*0.52, topH*0.40, mascotMood());

  drawBoardFrame();
  if(state!=="ready"){                     // title screen shows frame only — no blocks
    for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++) drawCell(r,c);
  }

  // particles (line fragments)
  for(var i=0;i<parts.length;i++){ var p=parts[i]; ctx.globalAlpha=Math.max(0,p.life); glow(p.color,2);
    var ang=Math.atan2(p.vy,p.vx); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-Math.cos(ang)*p.len,p.y-Math.sin(ang)*p.len); gs(); }
  ctx.globalAlpha=1;
  // beams / rings / floating score text
  for(i=0;i<floats.length;i++){ var f=floats[i]; ctx.globalAlpha=Math.max(0,f.life);
    if(f.beam){ glow(f.color,3+6*f.life); ctx.beginPath(); ctx.moveTo(f.x1,f.y1); ctx.lineTo(f.x2,f.y2); gs(); }
    else if(f.ring){ glow(f.color,3); ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1-f.life)+8,0,6.283); gs(); }
    else txt(f.txt,f.x,f.y,Math.min(22,cell*0.4),f.color,"center");
  }
  ctx.globalAlpha=1;

  if(state==="ready"){
    txt("VECTOR",W/2,H*0.32,Math.min(60,W*0.14),"#00e5ff","center");
    txt("CRUSH",W/2,H*0.32+Math.min(64,W*0.15),Math.min(60,W*0.14),"#ff2fb0","center");
    txt("TAP 2+ SAME BLOCKS TO CLEAR",W/2,H*0.56,Math.min(15,W*0.036),"#39ff88","center");
    txt("BEST "+best,W/2,H*0.62,Math.min(16,W*0.04),"#ffe500","center");
    if(Math.sin(T*4)>0) txt("- TAP TO START -",W/2,H*0.74,Math.min(20,W*0.05),"#ffffff","center");
  }
  if(state==="over"){
    ctx.globalAlpha=0.75; ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
    txt("TIME UP!",W/2,H*0.34,Math.min(52,W*0.12),"#ff2fb0","center");
    txt("SCORE",W/2,H*0.48,Math.min(20,W*0.05),"#00e5ff","center");
    txt(""+score,W/2,H*0.56,Math.min(56,W*0.13),"#ffe500","center");
    txt((score>=best?"NEW BEST!":"BEST "+best),W/2,H*0.66,Math.min(20,W*0.05),"#39ff88","center");
    if(Math.sin(T*4)>0) txt("- TAP TO RETRY -",W/2,H*0.78,Math.min(20,W*0.05),"#ffffff","center");
  }
  drawMute();
  ctx.restore();
}

function drawMute(){
  var x=muteX, y=muteY, r=muteR*0.6;
  glow(muted?"#ff2fb0":"#39ff88",2);
  ctx.beginPath(); ctx.moveTo(x-r,y-r*0.4); ctx.lineTo(x-r*0.3,y-r*0.4); ctx.lineTo(x+r*0.3,y-r); ctx.lineTo(x+r*0.3,y+r); ctx.lineTo(x-r*0.3,y+r*0.4); ctx.lineTo(x-r,y+r*0.4); ctx.closePath(); gs();
  if(muted){ ctx.beginPath(); ctx.moveTo(x+r*0.5,y-r*0.7); ctx.lineTo(x+r*1.2,y+r*0.7); gs(); }
  else { ctx.beginPath(); ctx.arc(x+r*0.55,y,r*0.5,-0.85,0.85); gs(); ctx.beginPath(); ctx.arc(x+r*0.55,y,r*0.95,-0.7,0.7); gs(); }
}

function endGame(){ state="over"; overAt=performance.now(); if(score>best){best=score; localStorage.setItem(BEST_KEY,best);} musicStop(); sfxOver(); }

function frame(now){
  requestAnimationFrame(frame);                 // scheduled ONCE, at the top (survives errors below)
  var dt=Math.min(0.05,(now-last)/1000)||0; last=now;
  update(dt); render();
}
initBoard(); last=performance.now(); requestAnimationFrame(frame);

// expose for headless testing
if(typeof window!=="undefined"){ window.__game={update:update,render:render,resolveTap:resolveTap,startGame:startGame,
  get state(){return state;}, get score(){return score;}, get grid(){return grid;}, POW:POW,
  setPower:function(r,c,p){ if(grid[r]&&grid[r][c]) grid[r][c].power=p; }}; }
})();
</script>
